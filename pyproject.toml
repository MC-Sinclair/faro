[project]
name = "faro"
version = "0.1.0"
description = "Servidor MCP de verificación de API contra el paquete instalado"
requires-python = ">=3.12"
dependencies = ["mcp[cli]>=1.2"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "contrato: tests que tocan un venv real con SQLAlchemy instalado (lentos, fuera del ciclo rápido)",
]
